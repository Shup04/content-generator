<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Save Reel Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Save Reel Studio home"><span class="brand-mark">S</span><span>save reel<span class="brand-sub">STUDIO</span></span></a>
    <div class="local-label"><span class="dot"></span> LOCAL WORKSPACE</div>
    <nav aria-label="Studio navigation">
      <button data-tab="workspace" aria-pressed="true"><span>01</span> Reel workspace</button>
      <button data-tab="prompts" aria-pressed="false"><span>02</span> Prompt editor</button>
      <button data-tab="settings" aria-pressed="false"><span>03</span> Models & settings</button>
      <button data-tab="library" aria-pressed="false"><span>04</span> Video library</button>
      <button data-tab="jobs" aria-pressed="false"><span>05</span> Activity <i id="job-dot" hidden></i></button>
    </nav>
    <div class="draft-switcher"><label for="draft-select">YOUR DRAFTS</label><select id="draft-select" aria-label="Current draft"></select><button id="new-draft" class="sidebar-new">+ New draft</button></div>
    <div class="sidebar-footer"><span>CHOOSE YOUR SAVE</span><p>Four worlds.<br>One place to make them.</p><small>Runs on your computer.<br>Generation uses your API keys.</small></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div><span class="eyebrow">WORKING DRAFT</span><strong id="draft-name">Loading…</strong></div><div class="top-actions"><span id="save-state" role="status">Saved locally</span><button id="duplicate" class="button quiet">Duplicate</button><button id="save" class="button primary" disabled>Save changes</button></div></header>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="running" class="running" hidden></div>
    <main id="main" tabindex="-1"><section id="view" aria-live="off"><p>Loading your workspace…</p></section></main>
  </div>
  <dialog id="modal"><div class="modal-bar"><h2 id="modal-title">Preview</h2><button id="close-modal" class="button quiet">Close</button></div><div id="modal-body"></div></dialog>
</body>
</html>
